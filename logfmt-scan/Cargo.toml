[package]
name = "logfmt_scan"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false
description = "The logfmt scan source for nu_plugin_polars_dyn, to compile in with nu-polars-dyn-build."

[lib]
bench = false
test = false
doctest = false

[dependencies]
# crates.io form, so that nu-polars-dyn-build's `[patch.crates-io]` resolves it to the one copy
# the generated project uses. This crate is built through that builder, not on its own.
nu_plugin_polars_dyn = "0.2"
polars_logfmt = { path = "../polars-logfmt" }
polars = "=0.55.2"
memchr = "=2.8.0"
serde_json = "=1.0.151"

[lints.clippy]
unwrap_used = "deny"
